<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>습관 체크</title>
<style>
  body { font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; }
  #warning { background: #fff3cd; border: 1px solid #e0c060; padding: 8px 12px; margin-bottom: 12px; }
  #add-form { display: flex; gap: 8px; margin-bottom: 8px; }
  #name-input { flex: 1; min-width: 0; padding: 8px; font-size: 16px; }
  #add-form button { padding: 8px 14px; font-size: 16px; white-space: nowrap; }
  h2 { font-size: 16px; margin: 16px 0 4px; }
  #message { color: #b00020; min-height: 1.2em; margin: 0 0 12px; font-size: 14px; }
  ul { list-style: none; padding: 0; margin: 0; }
  #today-date { margin: 0; color: #555; font-size: 14px; }
  #summary { margin: 4px 0 12px; font-size: 22px; font-weight: bold; }
  li { padding: 10px 0; border-bottom: 1px solid #ddd; }
  .row { display: flex; align-items: center; gap: 10px; }
  .info { flex: 1; min-width: 0; }
  .streak { display: block; font-size: 13px; color: #b25e00; }
  .week { display: flex; gap: 4px; margin-top: 8px; }
  .day { flex: 1; min-width: 0; text-align: center; }
  .cell { display: block; width: 100%; height: 40px; padding: 0; border: 0; border-radius: 6px; background: #e0e0e0; color: #fff; font-size: 18px; line-height: 1; cursor: pointer; }
  .cell[aria-pressed="true"] { background: #4caf50; }
  .cell.today { outline: 2px solid #333; outline-offset: 1px; }
  .dow { display: block; margin-top: 2px; font-size: 11px; color: #777; }
  .day.today .dow { color: #333; font-weight: bold; }
  .check { flex: none; width: 40px; height: 40px; font-size: 22px; line-height: 1; cursor: pointer; background: #fff; border: 2px solid #4caf50; border-radius: 6px; color: #fff; }
  .check[aria-pressed="true"] { background: #4caf50; }
  .name { display: block; word-break: break-all; }
  .name.done { text-decoration: line-through; color: #888; }
  .delete { flex: none; width: 40px; height: 40px; cursor: pointer; }
  #empty { color: #444; padding: 12px 0; }
</style>
</head>
<body>
  <h1>습관 체크</h1>
  <p id="today-date"></p>
  <p id="summary" role="status"></p>
  <div id="warning" hidden>기록을 저장할 수 없어요. 브라우저(Chrome, Edge 등)에서 index.html을 직접 열어 주세요.</div>

  <form id="add-form">
    <input id="name-input" type="text" maxlength="20" placeholder="새 습관 이름" autocomplete="off">
    <button type="submit">추가</button>
  </form>
  <p id="message" role="status"></p>

  <h2>오늘 체크 목록</h2>
  <ul id="list"></ul>
  <p id="empty" hidden>아직 습관이 없어요. 위에서 습관을 추가해 보세요.</p>

<script>
(function () {
  var STORAGE_KEY = 'habit-tracker-v1';
  var MAX_HABITS = 10;
  var MAX_NAME = 20;

  var state = { habits: [] };
  var storageOk = true;

  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  var renderedDay = '';

  var dateEl = document.getElementById('today-date');
  var summaryEl = document.getElementById('summary');
  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var warningEl = document.getElementById('warning');
  var messageEl = document.getElementById('message');
  var formEl = document.getElementById('add-form');
  var inputEl = document.getElementById('name-input');

  // 로컬 시간 기준 YYYY-MM-DD (toISOString은 UTC라 쓰지 않는다)
  function dateKey(d) {
    var m = d.getMonth() + 1;
    var day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }

  // n일 전 날짜 (0 = 오늘)
  function daysAgo(n) {
    var d = new Date();
    d.setDate(d.getDate() - n);
    return d;
  }

  // 연속 기록: 오늘을 했으면 오늘부터, 아직이면 어제부터 거꾸로 센다
  function streakOf(habit) {
    var n = habit.done[dateKey(daysAgo(0))] ? 0 : 1;
    var count = 0;
    while (habit.done[dateKey(daysAgo(n))]) {
      count++;
      n++;
    }
    return count;
  }

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 4);
  }

  function isValidHabit(h) {
    return h && typeof h.id === 'string' && typeof h.name === 'string' &&
      h.done && typeof h.done === 'object' && !Array.isArray(h.done);
  }

  function load() {
    var raw;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      storageOk = false;
      return;
    }
    if (raw === null) return;
    try {
      var data = JSON.parse(raw);
      if (!data || !Array.isArray(data.habits) || !data.habits.every(isValidHabit)) {
        throw new Error('bad shape');
      }
      state = data;
    } catch (e) {
      state = { habits: [] };
      storageOk = false;
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      storageOk = false;
    }
  }

  function renderSummary(today) {
    var total = state.habits.length;
    var doneCount = state.habits.filter(function (h) { return h.done[today]; }).length;
    if (total === 0) {
      summaryEl.textContent = '습관을 추가해 보세요';
    } else {
      summaryEl.textContent = doneCount + '/' + total + ' 완료' +
        (doneCount === total ? ' 🎉 오늘 다 했어요' : '');
    }
  }

  function buildWeek(habit, today) {
    var week = document.createElement('div');
    week.className = 'week';

    for (var i = 6; i >= 0; i--) {
      var d = daysAgo(i);
      var key = dateKey(d);
      var done = !!habit.done[key];
      var label = (d.getMonth() + 1) + '월 ' + d.getDate() + '일';

      var day = document.createElement('div');
      day.className = 'day' + (key === today ? ' today' : '');

      var cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cell' + (key === today ? ' today' : '');
      cell.textContent = done ? '✓' : '';
      cell.setAttribute('aria-pressed', done ? 'true' : 'false');
      cell.setAttribute('aria-label', habit.name + ' ' + label + (done ? ' 체크됨' : ' 안 함'));
      cell.addEventListener('click', (function (id, k) {
        return function () { toggleDay(id, k); };
      })(habit.id, key));

      var dow = document.createElement('span');
      dow.className = 'dow';
      dow.textContent = DOW[d.getDay()];

      day.appendChild(cell);
      day.appendChild(dow);
      week.appendChild(day);
    }
    return week;
  }

  function render() {
    var now = new Date();
    var today = dateKey(now);
    renderedDay = today;
    dateEl.textContent = (now.getMonth() + 1) + '월 ' + now.getDate() + '일 ' + DOW[now.getDay()] + '요일';
    warningEl.hidden = storageOk;
    emptyEl.hidden = state.habits.length > 0;
    renderSummary(today);
    listEl.textContent = '';

    state.habits.forEach(function (habit) {
      var done = !!habit.done[today];
      var streak = streakOf(habit);

      var li = document.createElement('li');
      var row = document.createElement('div');
      row.className = 'row';

      var check = document.createElement('button');
      check.type = 'button';
      check.className = 'check';
      check.textContent = done ? '✓' : '';
      check.setAttribute('aria-pressed', done ? 'true' : 'false');
      check.setAttribute('aria-label', habit.name + ' 오늘 체크');
      check.addEventListener('click', function () { toggleDay(habit.id, today); });

      var info = document.createElement('div');
      info.className = 'info';

      var name = document.createElement('span');
      name.className = 'name' + (done ? ' done' : '');
      name.textContent = habit.name;

      var streakEl = document.createElement('span');
      streakEl.className = 'streak';
      streakEl.textContent = streak > 0 ? '🔥 ' + streak + '일 연속' : '시작해 볼까요';

      info.appendChild(name);
      info.appendChild(streakEl);

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'delete';
      del.textContent = '✕';
      del.setAttribute('aria-label', habit.name + ' 삭제');
      del.addEventListener('click', function () { removeHabit(habit.id); });

      row.appendChild(check);
      row.appendChild(info);
      row.appendChild(del);
      li.appendChild(row);
      li.appendChild(buildWeek(habit, today));
      listEl.appendChild(li);
    });
  }

  function commit() {
    save();
    render();
  }

  function addHabit(rawName) {
    var name = rawName.trim();
    if (!name) return false;
    if (state.habits.length >= MAX_HABITS) {
      messageEl.textContent = '습관은 최대 ' + MAX_HABITS + '개까지 추가할 수 있어요';
      return false;
    }
    state.habits.push({ id: newId(), name: name.slice(0, MAX_NAME), done: {} });
    messageEl.textContent = '';
    commit();
    return true;
  }

  function removeHabit(id) {
    var habit = state.habits.find(function (h) { return h.id === id; });
    if (!habit) return;
    if (!confirm("'" + habit.name + "' 습관을 삭제할까요? 기록도 함께 사라집니다.")) return;
    state.habits = state.habits.filter(function (h) { return h.id !== id; });
    messageEl.textContent = '';
    commit();
  }

  function toggleDay(id, key) {
    var habit = state.habits.find(function (h) { return h.id === id; });
    if (!habit) return;
    if (habit.done[key]) delete habit.done[key];
    else habit.done[key] = true;
    commit();
  }

  // 자정이 지난 뒤 탭으로 돌아오면 오늘 기준으로 다시 그린다
  function refreshIfDayChanged() {
    if (dateKey(new Date()) !== renderedDay) render();
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) refreshIfDayChanged();
  });
  window.addEventListener('focus', refreshIfDayChanged);

  formEl.addEventListener('submit', function (e) {
    e.preventDefault();
    if (addHabit(inputEl.value)) inputEl.value = '';
    inputEl.focus();
  });

  load();
  render();
})();
</script>
</body>
</html>
